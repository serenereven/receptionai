<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прототип: ИИ-ассистент заселения</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e2e2df;
    --text: #1f1f1d;
    --text-muted: #6b6b66;
    --accent: #2f6f4f;
    --accent-hover: #255a40;
    --status-received: #2f6f4f;
    --status-received-bg: #e6f2ea;
    --status-not-received: #a3401f;
    --status-not-received-bg: #fbeae4;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  main {
    width: 100%;
    max-width: 520px;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0 0 24px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }

  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .status-toggle {
    display: flex;
    gap: 8px;
  }

  .status-toggle input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .status-toggle label {
    flex: 1;
    text-align: center;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
    color: var(--text-muted);
    transition: border-color .15s, background .15s, color .15s;
  }

  .status-toggle input:checked + label {
    border-color: currentColor;
  }

  .status-toggle input#status-not-received:checked + label {
    background: var(--status-not-received-bg);
    color: var(--status-not-received);
    border-color: var(--status-not-received);
  }

  .status-toggle input#status-received:checked + label {
    background: var(--status-received-bg);
    color: var(--status-received);
    border-color: var(--status-received);
  }

  textarea {
    width: 100%;
    min-height: 90px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    resize: vertical;
  }

  textarea:focus, .status-toggle input:focus-visible + label {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }

  button:hover:not(:disabled) { background: var(--accent-hover); }

  button:disabled {
    background: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
  }

  .response-card {
    display: none;
  }

  .response-card.visible {
    display: block;
  }

  .response-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .response-text {
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .response-error {
    color: var(--status-not-received);
  }

  .hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }
</style>
</head>
<body>
<main>
  <h1>ИИ-ассистент заселения</h1>
  <p class="subtitle">Тестовый прототип интеграции ИИ с данными бронирования</p>

  <div class="card">
    <span class="field-label">Статус паспорта гостя</span>
    <div class="status-toggle" role="radiogroup" aria-label="Статус паспорта">
      <input type="radio" name="status" id="status-not-received" value="not_received" checked>
      <label for="status-not-received">Не получен</label>

      <input type="radio" name="status" id="status-received" value="received">
      <label for="status-received">Получен</label>
    </div>

    <div style="height: 20px"></div>

    <label class="field-label" for="message">Сообщение гостя</label>
    <textarea id="message" placeholder="Например: Как мне заселиться?"></textarea>
    <p class="hint" id="input-error"></p>

    <button id="submit-btn" onclick="askAI()">Получить ответ ИИ</button>
  </div>

  <div class="card response-card" id="response-card">
    <p class="response-label">Ответ ИИ</p>
    <p class="response-text" id="response-text"></p>
  </div>
</main>

<script>
  const API_URL = "/api/chat";

  const messageInput = document.getElementById("message");
  const inputError = document.getElementById("input-error");
  const submitBtn = document.getElementById("submit-btn");
  const responseCard = document.getElementById("response-card");
  const responseText = document.getElementById("response-text");

  messageInput.addEventListener("input", () => {
    if (messageInput.value.trim()) inputError.textContent = "";
  });

  async function askAI() {
    const message = messageInput.value.trim();
    const status = document.querySelector('input[name="status"]:checked').value;

    if (!message) {
      inputError.textContent = "Введите сообщение гостя";
      inputError.style.color = "var(--status-not-received)";
      messageInput.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Спрашиваю ИИ...";
    responseCard.classList.remove("visible");
    responseText.classList.remove("response-error");

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, passport_status: status }),
      });

      const data = await res.json();

      if (!res.ok) {
        const detail = typeof data.detail === "string"
          ? data.detail
          : "Некорректный запрос";
        throw new Error(detail);
      }

      responseText.textContent = data.reply;
      responseCard.classList.add("visible");
    } catch (err) {
      responseText.textContent = "Ошибка: " + err.message;
      responseText.classList.add("response-error");
      responseCard.classList.add("visible");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Получить ответ ИИ";
    }
  }
</script>
</body>
</html>
